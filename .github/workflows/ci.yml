name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Debug)
        run: dotnet build OriginalTwoLayerRegexArchitecture.sln -c Debug

      - name: Build (Release, warnings as errors + docs)
        run: dotnet build OriginalTwoLayerRegexArchitecture.sln -c Release

      - name: Test (Debug)
        run: dotnet test src/DevelApp.TwoLayerRegex.Tests -c Debug --no-build

      - name: Test (Release)
        run: dotnet test src/DevelApp.TwoLayerRegex.Tests -c Release --no-build

      - name: Demo runs (Release)
        run: dotnet run --project src/DevelApp.TwoLayerRegex.Demo -c Release --no-build
